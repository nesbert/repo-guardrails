name: Commit messages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: npx --no -- repo-guardrails commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Validate the pushed commit
        if: github.event_name == 'push'
        run: npx --no -- repo-guardrails commitlint --last --verbose
