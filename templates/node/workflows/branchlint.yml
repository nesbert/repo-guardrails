name: Branch name

on: [push, pull_request]

permissions:
  contents: read

jobs:
  branchlint:
    name: Branchlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate pushed or pull request branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: npx --no -- repo-guardrails branchlint "$BRANCH_NAME"
